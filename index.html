<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Planner</title>
  <link rel="stylesheet" href="styles.css?v=9">
</head>
<body data-palette="#3a6ea5">
  <main class="wrap">
    <div class="topbar">
      <span class="brand">Daily Planner</span>
      <span class="topbar-right">
        <span id="authBox" class="authbox" hidden></span>
        <a class="pill-link" href="stats.html">Stats &rarr;</a>
      </span>
    </div>

    <div id="readonlyBanner" class="readonly-banner" hidden>
      You're viewing this planner in read-only mode.
    </div>

    <header class="head">
      <button id="prevDay" class="navbtn" aria-label="Previous day" title="Previous day">&#9664;</button>
      <div class="daylabel">
        <h1 id="dayTitle">Today</h1>
        <p id="dayDate" class="subtitle"></p>
      </div>
      <button id="nextDay" class="navbtn" aria-label="Next day" title="Next day">&#9654;</button>
    </header>

    <table class="plan-table" aria-label="Daily plan">
      <thead>
        <tr>
          <th class="col-grip" aria-label="Reorder"></th>
          <th class="col-task">Task</th>
          <th class="col-notes">Notes</th>
          <th class="col-done">Complete?</th>
        </tr>
      </thead>
      <tbody id="planBody">
        <!-- 15 active rows injected by script.js -->
      </tbody>
    </table>

    <div class="table-actions">
      <button id="clearBtn" class="ghost-btn" type="button">Clear day</button>
    </div>

    <section class="day-notes">
      <h2 class="day-notes-head">Notes</h2>
      <textarea id="dayNotes" class="day-notes-field"
        placeholder="Free-form notes for this day (not carried over)."></textarea>
    </section>

    <section class="completed">
      <h2 id="completedTodayHead" class="completed-head">Completed today</h2>
      <ul id="completedTodayList" class="completed-list"></ul>
    </section>

    <section class="completed">
      <h2 class="completed-head">Completed &middot; past 7 working days</h2>
      <ul id="completedList" class="completed-list"></ul>
    </section>

    <section class="future">
      <h2 class="future-head">Future tasks</h2>
      <table class="plan-table" aria-label="Future tasks backlog">
        <thead>
          <tr>
            <th class="col-task">Task</th>
            <th class="col-notes">Notes</th>
          </tr>
        </thead>
        <tbody id="futureBody">
          <!-- 10 rows injected by script.js -->
        </tbody>
      </table>
    </section>
  </main>

  <!-- Firebase (shared saving). Loaded before the app; see SETUP.md. -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js?v=10"></script>
  <script src="store.js?v=9"></script>
  <script src="script.js?v=9"></script>
</body>
</html>
