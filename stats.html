<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stats — Daily Planner</title>
  <link rel="stylesheet" href="styles.css?v=21">
</head>
<body data-palette="#3a6ea5">
  <main class="wrap">
    <div class="topbar">
      <span class="brand">Stats</span>
      <a class="pill-link" href="index.html">&larr; Planner</a>
    </div>

    <header class="head head--stats">
      <div class="daylabel daylabel--left">
        <h1>Tasks completed by week</h1>
        <p class="subtitle">Count of tasks marked complete, grouped by work week (Mon–Fri).</p>
      </div>
    </header>

    <figure class="chart-figure">
      <div id="chart" class="chart"></div>
    </figure>

    <details class="table-view">
      <summary>View as table</summary>
      <table class="data-table" id="statsTable">
        <thead><tr><th>Week of</th><th>Completed</th></tr></thead>
        <tbody></tbody>
      </table>
    </details>

    <header class="head head--stats head--section">
      <div class="daylabel daylabel--left">
        <h1>Emails in inbox at 5 PM</h1>
        <p class="subtitle">Size of your main Outlook inbox, recorded once a day (~5 PM), tracked over time.</p>
      </div>
    </header>

    <figure class="chart-figure">
      <div id="inboxChart" class="chart"></div>
    </figure>

    <details class="table-view">
      <summary>View as table</summary>
      <table class="data-table" id="inboxTable">
        <thead><tr><th>Day</th><th>Inbox size</th></tr></thead>
        <tbody></tbody>
      </table>
    </details>
  </main>

  <!-- Firebase (shared saving). Loaded before the chart; see SETUP.md. -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js?v=10"></script>
  <script src="store.js?v=12"></script>
  <script src="stats.js?v=3"></script>
</body>
</html>
